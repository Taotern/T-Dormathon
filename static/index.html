<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Dormathon 私人证据研判：地域、项目、来源调查与人工复核。">
  <title>Dormathon</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/preparation.css">
  <link rel="stylesheet" href="/workbench-shell.css">
  <link rel="stylesheet" href="/immersive.css">
  <script type="module" src="/app.js"></script>
</head>
<body class="immersive-app">
  <a class="skip-link" href="#main">跳转到场景</a>
  <main id="main" tabindex="-1">
    <div id="connection-notice" class="scene-connection-notice" role="status" hidden></div>
    <div id="page-content" aria-busy="true"></div>
  </main>
  <dialog id="workbench-dialog" class="workbench-dialog" aria-labelledby="workbench-title">
    <header class="workbench-head"><h1 id="workbench-title">调查</h1><div><button class="icon-button" id="refresh-button" aria-label="重读已保存结果" title="重读已保存结果">↻</button><button class="icon-button" id="workbench-close" aria-label="关闭调查，回到场景">×</button></div></header>
    <div id="workbench-content"></div>
  </dialog>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <dialog id="detail-dialog" class="detail-dialog"><div class="dialog-inner" id="detail-content"></div></dialog>
  <noscript><div class="notice warning">此工作区需要 JavaScript。</div></noscript>
</body>
</html>
